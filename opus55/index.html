function card(r){
 var L=lvlNum(r.level),has=!!r.href,rw=r.reward;
 var el=h('article',{cls:'card'+(has?'':' nolink'),style:'--h:'+hue(rw)+';--r:'+(rw==null?0:Math.max(0,Math.min(1,rw)))});
 var ttl='seed '+(r.seed===''||r.seed==null?'?':r.seed);
 var t=has?h('a',{cls:'title',href:r.href,text:ttl,'aria-label':'open viewer: '+r.name+', reward '+fmt(rw)}):h('span',{cls:'title',text:ttl});
 el.appendChild(h('div',{cls:'row'},h('span',{cls:'lvl lvl'+L,text:r.level||'?'}),t,r.seconds!=null?h('span',{cls:'dur',title:'agent run time',text:dur(r.seconds)}):null));
 el.appendChild(h('div',{cls:'meta',title:r.id,text:[r.task,r.agent].filter(Boolean).join(' · ')||r.id}));
 el.appendChild(h('div',{cls:'reward'},h('div',{cls:'rnum num',text:fmt(rw)}),h('div',{cls:'bar',role:'img','aria-label':'reward '+fmt(rw)},h('i'))));
 var ch=h('div',{cls:'chips'});
 if(r.error)ch.appendChild(chip('bad','error: '+r.error,r.error));
 if(r.missing)ch.appendChild(chip('warn','viewer missing',r.missing));
 if(r.gates_ok===true)ch.appendChild(chip('ok','✓ gates ok'));
 else if(r.gates_ok===false)ch.appendChild(chip('bad','✗ gates: '+((r.failed_gates||[]).join(', ')||'failed'),'failed gates'));
 if(r.s1===true)ch.appendChild(chip('ok','S1 opening met'+(r.s1_deg!=null?' · '+r.s1_deg+'°':'')));
 else if(r.s1===false)ch.appendChild(chip('bad','S1 opening not met'+(r.s1_deg!=null?' · '+r.s1_deg+'°':'')));
 var p=r.playback;
 if(p==='reproduced')ch.appendChild(chip('ok','playback reproduced'));
 else if(p==='mismatch')ch.appendChild(chip('warn','⚠ playback mismatch'));
 else if(p==='no_log')ch.appendChild(chip('','playback: no log'));
 else if(p)ch.appendChild(chip('bad','playback '+p.replace(/_/g,' ')));
 else if(!r.error)ch.appendChild(chip('','no playback'));
 el.appendChild(ch);
 var parts=r.parts||[];
 if(parts.length){var v=h('div',{cls:'vol num'});parts.forEach(function(q){v.appendChild(h('span',{},q.name+' ',h('span',{cls:'rm',text:'−'+fmt(q.removed,1)}),' ',h('span',{cls:'ad',text:'+'+fmt(q.added,1)}),' mm³'))});el.appendChild(v)}
 else if(r.parts&&!r.parts.length&&!r.error&&r.hasparts)el.appendChild(h('div',{cls:'vol',text:'no change to editable parts'}));
 var fp=r.steps>1?fingerprint(r):null;
 if(fp)el.appendChild(h('div',{cls:'fp'},fp,h('span',{cls:'num',text:r.steps+' steps · '+r.edits+' edits'+(r.edit_fail?' ('+r.edit_fail+' failed)':'')})));
 else if(r.steps>1)el.appendChild(h('div',{cls:'fp'},h('span',{cls:'num',text:r.steps+' steps'})));
 var ln=h('div',{cls:'links'});
 if(has){ln.appendChild(h('a',{href:r.href+'#mode=compare',text:'Compare'}));if(r.playback&&(r.edits||0)>0)ln.appendChild(h('a',{href:r.href+'#mode=playback',text:'Playback'}))}
 if(r.grade_href)ln.appendChild(h('a',{href:r.grade_href,text:'grade.json'}));
 if(ln.children.length)el.appendChild(ln);
 return el}
function cmp(a,b){var k=st.sort,d=0;
 if(k==='reward')d=(a.reward==null?-1:a.reward)-(b.reward==null?-1:b.reward);
 else if(k==='level')d=lvlNum(a.level)-lvlNum(b.level);
 else if(k==='seed')d=(+a.seed||0)-(+b.seed||0);
 else d=a.name<b.name?-1:a.name>b.name?1:0;
 if(!d)d=lvlNum(a.level)-lvlNum(b.level)||(+a.seed||0)-(+b.seed||0)||(a.name<b.name?-1:1);
 return st.asc?d:-d}
function draw(){
 var q=st.q.trim().toLowerCase(),main=$('main'),groups={},order=[],n=0;main.textContent='';
 R.forEach(function(r){
  if(st.lvl&&r.level!==st.lvl)return;if(st.fail&&!isFail(r))return;
  if(q&&[r.name,r.agent,r.task,r.group,r.level,'seed '+r.seed].join(' ').toLowerCase().indexOf(q)<0)return;
  if(!groups[r.group]){groups[r.group]=[];order.push(r.group)}groups[r.group].push(r);n++});
 order.forEach(function(g){var rs=groups[g].sort(cmp),m=rs.filter(function(r){return r.reward!=null}),
  mean=m.length?m.reduce(function(a,r){return a+r.reward},0)/m.length:null,sv=rs.filter(function(r){return r.reward>=1}).length;
  var sec=h('section',{cls:'group','aria-label':g});
  sec.appendChild(h('div',{cls:'ghead'},h('h2',{cls:'mono',text:g}),h('span',{text:rs.length+' runs · mean '+fmt(mean)+' · '+sv+' solved'})));
  var gr=h('div',{cls:'grid'});rs.forEach(function(r){gr.appendChild(card(r))});sec.appendChild(gr);main.appendChild(sec)});
 if(!n)main.appendChild(h('div',{cls:'empty',text:'No runs match these filters.'}));
 $('shown').textContent=n+' / '+R.length+' shown'}
$('q').addEventListener('input',function(e){st.q=e.target.value;draw()});
$('fail').onclick=function(e){st.fail=!st.fail;e.target.setAttribute('aria-pressed',String(st.fail));draw()};
$('sort').onchange=function(e){st.sort=e.target.value;draw()};
$('dir').onclick=function(e){st.asc=!st.asc;e.target.textContent=st.asc?'↑ asc':'↓ desc';draw()};
tiles();levels();draw();
})();
</script></body></html>
