schema_version = "1.4"
artifacts = ["/output"]

[metadata]
name = "cadfix-hinge-lid-l2-seed0000"
description = "Fix a 3D-printed box whose hinged lid jams while opening (hinge_lid L2)."
scenario = "hinge_lid"
level = "L2"
seed = 0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 4096

[[environment.mcp_servers]]
name = "cadfix"
transport = "stdio"
command = "python3"
args = ["-m", "cadfix.env.server"]
